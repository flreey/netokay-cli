name: Bootstrap npm publish (one-time)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to bootstrap
        required: true
        type: string
      confirm:
        description: Type BOOTSTRAP_ONCE to authorize the one-time path
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    if: inputs.confirm == 'BOOTSTRAP_ONCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-bootstrap
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Pin npm trusted-publishing CLI
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"
      - name: Enable Corepack
        run: corepack enable
      - name: Verify package version and install
        run: |
          printf '%s\n' "$RELEASE_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          test "$(node -p "require('./apps/cli/package.json').version")" = "$RELEASE_VERSION"
          corepack pnpm install --frozen-lockfile
      - name: Build, test, pack, and smoke the exact tarball
        run: |
          corepack pnpm build
          corepack pnpm typecheck
          corepack pnpm test
          corepack pnpm run pack:smoke
          version="$(node -p "require('./apps/cli/package.json').version")"
          tarball=".release-pack/netokay-${version}.tgz"
          test -f "$tarball"
          test "$(find .release-pack -maxdepth 1 -type f -name 'netokay-*.tgz' | wc -l | tr -d ' ')" = 1
          node scripts/public-pack-smoke.mjs --tarball "$PWD/$tarball"
      - name: Finalize and validate the exact release manifest
        env:
          NETOKAY_PRIVATE_SOURCE_COMMIT: ${{ vars.NETOKAY_PRIVATE_SOURCE_COMMIT }}
          NETOKAY_WORKER_VERSION: ${{ vars.NETOKAY_WORKER_VERSION }}
          NETOKAY_PRODUCTION_CONTROL_URL: ${{ vars.NETOKAY_PRODUCTION_CONTROL_URL }}
        run: |
          test -n "$NETOKAY_PRIVATE_SOURCE_COMMIT"
          test -n "$NETOKAY_WORKER_VERSION"
          test -n "$NETOKAY_PRODUCTION_CONTROL_URL"
          public_commit="$(git rev-parse HEAD)"
          printf '%s\n' "$public_commit" | grep -Eq '^[0-9a-f]{40}$'
          version="$(node -p "require('./apps/cli/package.json').version")"
          tarball=".release-pack/netokay-${version}.tgz"
          node scripts/release-manifest.mjs finalize \
            --file release-manifest.json \
            --output release-manifest.final.json \
            --private-source-commit "$NETOKAY_PRIVATE_SOURCE_COMMIT" \
            --public-source-commit "$public_commit" \
            --worker-version "$NETOKAY_WORKER_VERSION" \
            --production-control-url "$NETOKAY_PRODUCTION_CONTROL_URL" \
            --tarball "$PWD/$tarball" \
            --tag "v${version}"
          node scripts/release-manifest.mjs validate --file release-manifest.final.json
      - name: Store manifest and verified tarball artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: netokay-bootstrap-release-${{ inputs.version }}
          path: |
            release-manifest.final.json
            .release-pack/netokay-*.tgz
          if-no-files-found: error
      - name: Publish one time with protected bootstrap token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          version="$(node -p "require('./apps/cli/package.json').version")"
          tarball=".release-pack/netokay-${version}.tgz"
          node scripts/release-manifest.mjs verify --file release-manifest.final.json --tarball "$PWD/$tarball"
          npm publish "$tarball" --provenance --access public
      # After this succeeds, configure npm Trusted Publisher for publish.yml,
      # revoke/delete NPM_BOOTSTRAP_TOKEN, and disable this workflow.
